name: Update exchange rates

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install playwright && npx playwright install --with-deps chromium
      - run: node scripts/update-rates.mjs
        env:
          BUY_OFFSET: "0"
          SELL_OFFSET: "0"
      - name: Commit if changed
        run: |
          git config user.name "rates-bot"
          git config user.email "bot@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || (git commit -m "Update rates" && git push)
